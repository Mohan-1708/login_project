<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 90vh;
            background-color: #f4f4f4;
        }
        form {
            background: #fff;
            border: 1px solid #ccc;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        div {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="email"],
        input[type="password"] {
            width: 300px;
            padding: 8px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745; /* Green color for register */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        /* Style for the error message */
        .error-message {
            color: #D8000C; /* Red */
            background-color: #FFD2D2;
            border: 1px solid #D8000C;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<form th:action="@{/api/register}" method="post">
    <h2 style="text-align: center;">Create Account</h2>

    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="username"
               placeholder="your@email.com"
               required
               autofocus>
    </div>

    <div>
        <label for="password">Password:</label>
        <input type="password"
               id="password"
               name="password"
               required>
    </div>

    <div>
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               required>
    </div>

    <div>
        <button type="submit">Register</button>
    </div>
</form>

</body>
</html>
