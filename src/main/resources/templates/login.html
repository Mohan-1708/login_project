<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Event Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">

<div class="text-center mb-8">
    <h1 class="text-4xl font-bold text-gray-800">Event Management App</h1>
    <p class="text-gray-500 mt-2">Sign in to continue</p>
</div>

<div class="w-full max-w-md">
    <form id="login-form" action="/api/login" method="post" class="bg-white shadow-md rounded-lg px-8 pt-6 pb-8 mb-4">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                Email Address
            </label>
            <input class="shadow-sm appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="email" name="username" type="email" placeholder="you@example.com" required autofocus>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                Password
            </label>
            <input class="shadow-sm appearance-none border rounded w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" name="password" type="password" placeholder="••••••••••" required>
        </div>
        <div class="flex items-center justify-between">
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline w-full" type="submit">
                Sign In
            </button>
        </div>
        <div id="response-message" class="mt-4 text-center text-sm font-medium"></div>
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">
                Don't have an account?
                <a href="/register" class="font-bold text-blue-500 hover:text-blue-800">
                    Register now
                </a>
            </p>
        </div>
    </form>
</div>

<footer class="text-center text-gray-500 text-sm mt-8">
    <p>Made with ❤️ by Mohan</p>
</footer>

<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const responseMessageDiv = document.getElementById('response-message');
        responseMessageDiv.textContent = '';
        responseMessageDiv.className = '';

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                responseMessageDiv.textContent = 'Login successful! Redirecting...';
                responseMessageDiv.classList.add('text-green-500');
                setTimeout(() => { window.location.href = '/home'; }, 1000);
            } else {
                const result = await response.json();
                responseMessageDiv.textContent = result.error || 'Login failed.';
                responseMessageDiv.classList.add('text-red-500');
            }
        } catch (error) {
            console.error('Login error:', error);
            responseMessageDiv.textContent = 'An error occurred. Please try again.';
            responseMessageDiv.classList.add('text-red-500');
        }
    });
</script>
</body>
</html>
