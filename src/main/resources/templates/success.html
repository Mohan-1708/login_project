<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            background-color: #f8f9fa;
            margin: 0;
            color: #343a40;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #dee2e6;
        }
        h1 {
            font-size: 28px;
            margin: 20px 0 10px;
        }
        p {
            font-size: 1.2em;
            color: #6c757d;
        }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to the Protected Home Page!</h1>
    <p>You can only see this because your browser sent a valid JWT cookie.</p>
    <button onclick="logout()">Logout</button>
</div>

<script>
    async function logout() {
        // 1. Call the server's logout endpoint.
        // This will tell the server to send back a command to clear the HttpOnly cookie.
        await fetch('/api/logout', { method: 'POST' });

        // 2. After the cookie is cleared, redirect the user to the login page.
        window.location.href = '/login';
    }
</script>

</body>
</html>
